services:
    - type: web
    name: clipshort-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --timeout 300 --workers 1 --bind 0.0.0.0:$PORT"
    envVars:
            - key: PYTHON_VERSION
        value: 3.10.0
            - key: PYTHONUNBUFFERED
        value: "1"
