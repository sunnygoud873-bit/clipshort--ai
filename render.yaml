services:
    - type: web
    name: clipshort-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.maxUploadSize 4096
    envVars:
            - key: PYTHON_VERSION
        value: 3.10.0
